schema: 2
id: smoke-fail
name: Factory failure smoke
description: Deterministic failure check of the factory's APB link. One script node prints a fixed line and exits 1, so the run reports a node failure; no model, no file writes.
version: 1.0.0
params: []
defaults:
  profile: null
  max_retries: null
  timeout_seconds: null
  on_failure: stop
  max_parallel: 1
supervisor: null
trigger:
  when:
    - check that the factory sees a node failure of an APB run
  avoid_when:
    - any real coding work
  examples:
    - run the factory APB failure smoke
requires: null
effects:
  - fs_read
nodes:
  - id: start
    title: null
    expected_duration: null
    inputs: null
    outputs: null
    cache: null
    type: start
  - id: fail
    title: Print a fixed line and exit 1
    expected_duration: 1s
    inputs: null
    outputs: null
    cache: null
    type: script
    script: scripts/fail.sh
    runner: sh
    timeout_seconds: 60
  - id: finish
    title: null
    expected_duration: null
    inputs: null
    outputs: null
    cache: null
    type: finish
    outcome: success
    prompt: null
    profile: null
edges:
  - from: start
    to: fail
    condition: null
    fallback: false
    join: null
  - from: fail
    to: finish
    condition: null
    fallback: false
    join: null
