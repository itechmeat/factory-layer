schema: 2
id: smoke-stall
name: Factory stall smoke
description: Never-finishing check of the factory's stop path. One script node sleeps for an hour; the caller stops the run long before that. No model, no file writes.
version: 1.0.0
params: []
defaults:
  profile: null
  max_retries: null
  timeout_seconds: null
  on_failure: stop
  max_parallel: 1
supervisor: null
trigger:
  when:
    - check that the factory stops an APB run that exceeds its limit
  avoid_when:
    - any real coding work
  examples:
    - run the factory APB stall smoke
requires: null
effects:
  - fs_read
nodes:
  - id: start
    title: null
    expected_duration: null
    inputs: null
    outputs: null
    cache: null
    type: start
  - id: stall
    title: Sleep for an hour
    expected_duration: 1h
    inputs: null
    outputs: null
    cache: null
    type: script
    script: scripts/stall.sh
    runner: sh
    timeout_seconds: 3900
  - id: finish
    title: null
    expected_duration: null
    inputs: null
    outputs: null
    cache: null
    type: finish
    outcome: success
    prompt: null
    profile: null
edges:
  - from: start
    to: stall
    condition: null
    fallback: false
    join: null
  - from: stall
    to: finish
    condition: null
    fallback: false
    join: null
